
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SkyBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <a href="index.html" class="logo">✈ SkyBook</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="flights.html">Flights</a>
            <a href="bookings.html">My Bookings</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-btn">Register</a>
        </nav>
    </header>

    <!-- Registration Section -->
    <main class="auth-page">
        <div class="auth-card">

            <h1>Create Account</h1>
            <p class="auth-subtitle">Join SkyBook and start your journey!</p>

            <form class="auth-form" action="#" method="post">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="8"
                        required>
                </div>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

            </form>

            <p class="auth-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 SkyBook Flight Reservation System</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
