
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkyBook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <a href="index.html" class="logo">✈ SkyBook</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="flights.html">Flights</a>
            <a href="bookings.html">My Bookings</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-btn">Register</a>
        </nav>
    </header>

    <!-- Login Section -->
    <main class="auth-page">
        <div class="auth-card">

            <h1>Welcome Back!</h1>
            <p class="auth-subtitle">Login to continue your journey with SkyBook.</p>

            <form class="auth-form" action="#" method="post">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 SkyBook Flight Reservation System</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
