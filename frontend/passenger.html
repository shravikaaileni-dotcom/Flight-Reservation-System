
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBook | Passenger Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">✈ SkyBook</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="flights.html">Flights</a>
            <a href="bookings.html">My Bookings</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <section class="results-section">
        <h1>Passenger Details</h1>
        <p>Enter the details of the passengers travelling.</p>

        <div class="search-summary">
            <h3>Selected Flight</h3>
            <p>Flight Number: <span id="flight-number">Not selected</span></p>
        </div>

        <form class="auth-form" id="passenger-form">

            <div class="form-group">
                <label for="passenger-name">Full Name</label>
                <input type="text" id="passenger-name"
                       placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="passenger-age">Age</label>
                <input type="number" id="passenger-age"
                       min="1" max="120" placeholder="Enter age" required>
            </div>

            <div class="form-group">
                <label for="passenger-gender">Gender</label>
                <select id="passenger-gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="passenger-email">Email</label>
                <input type="email" id="passenger-email"
                       placeholder="Enter email" required>
            </div>

                        <div class="form-group">
                <h3>Select Your Seats</h3>
                <p id="seat-instruction">Choose your seats.</p>
                <div id="seat-layout" class="seat-layout"></div>
                <p>Selected Seats: <span id="selected-seats">None</span></p>
            </div>

            <button type="submit" class="primary-btn">
                Continue to Confirmation
            </button>

        </form>
    </section>

    <footer>
        <p>© 2026 SkyBook Flight Reservation System</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
